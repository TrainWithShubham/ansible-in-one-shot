---
- name: Remove conflicting packages (podman, buildah)
  dnf:
    name:
      - podman
      - buildah
    state: absent
  become: true

- name: Install dnf-plugins-core
  dnf:
    name: dnf-plugins-core
    state: present
  become: true

- name: Add Docker CE repo
  command: dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
  args:
    creates: /etc/yum.repos.d/docker-ce.repo
  become: true

- name: Install Docker CE
  dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: true

# Docker's bridge network needs the xt_addrtype kernel module. It ships in
# kernel-modules-extra, and a plain `dnf update` installs the newest kernel
# without rebooting into it, so the RUNNING kernel may not have the module and
# dockerd fails with "Extension addrtype ... missing kernel module".
- name: Install kernel-modules-extra (netfilter modules Docker needs)
  dnf:
    name: kernel-modules-extra
    state: present
  become: true

- name: Check the running kernel has xt_addrtype
  command: modinfo xt_addrtype
  register: docker_addrtype
  changed_when: false
  failed_when: false

- name: Reboot into the newest kernel if xt_addrtype is missing
  reboot:
    reboot_timeout: 600
  become: true
  when: docker_addrtype.rc != 0

- name: Re-check xt_addrtype after any reboot
  command: modinfo xt_addrtype
  register: docker_addrtype_after
  changed_when: false
  failed_when: false

# Fallback only: with iptables disabled Docker no longer manages NAT, so port
# publishing and outbound container traffic break. Skipped when the module exists.
- name: Configure Docker to use nftables (fallback)
  copy:
    content: |
      {
        "iptables": false
      }
    dest: /etc/docker/daemon.json
    mode: '0644'
  become: true
  when: docker_addrtype_after.rc != 0

- name: Start and enable containerd
  service:
    name: containerd
    state: started
    enabled: true
  become: true

- name: Reset failed Docker service state
  command: systemctl reset-failed docker.service
  changed_when: false
  failed_when: false
  become: true
